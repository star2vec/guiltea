<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#444"/>
    </marker>
    <marker id="arrblue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f4e9e"/>
    </marker>
  </defs>
  <rect width="2000" height="1120" fill="#ffffff"/>

  <!-- title -->
  <text x="1000" y="58" text-anchor="middle" font-size="40" font-weight="bold" fill="#111">What happens when an 8B model is talked into a harmful act, and what we did about it</text>
  <text x="1000" y="96" text-anchor="middle" font-size="22" fill="#444">Llama-3.1-8B-Instruct, base model, bf16 · 40 hand-checked harmful medical requests · frozen ten-turn persuasion chains · every internal number beside a norm-matched random control</text>

  <!-- lane labels -->
  <text x="40" y="170" font-size="24" font-weight="bold" fill="#1f4e9e">WHAT THE MODEL DOES</text>
  <text x="40" y="720" font-size="24" font-weight="bold" fill="#8a3b12">WHAT WE SEE INSIDE, AND WHAT MOVING IT DID</text>
  <line x1="40" y1="690" x2="1960" y2="690" stroke="#ddd" stroke-width="2"/>

  <!-- ===== top lane: six stages ===== -->
  <!-- helper: stage box at x, width 290 -->
  <!-- 1 refuses -->
  <g transform="translate(40,200)">
    <rect width="290" height="300" rx="18" fill="#eef3fb" stroke="#1f4e9e" stroke-width="3"/>
    <text x="145" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f4e9e">1 · Refuses</text>
    <!-- model glyph -->
    <circle cx="145" cy="120" r="34" fill="#fff" stroke="#1f4e9e" stroke-width="3"/>
    <circle cx="132" cy="114" r="4" fill="#1f4e9e"/><circle cx="158" cy="114" r="4" fill="#1f4e9e"/>
    <path d="M128,136 Q145,126 162,136" stroke="#1f4e9e" stroke-width="3" fill="none"/>
    <text x="145" y="190" text-anchor="middle" font-size="20" fill="#222">"I can't recommend that."</text>
    <text x="145" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">40 of 40 requests refused</text>
    <text x="145" y="258" text-anchor="middle" font-size="18" fill="#444">plain single-turn ask</text>
  </g>

  <!-- 2 persuaded -->
  <g transform="translate(365,200)">
    <rect width="290" height="300" rx="18" fill="#eef3fb" stroke="#1f4e9e" stroke-width="3"/>
    <text x="145" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f4e9e">2 · Is argued with</text>
    <circle cx="145" cy="120" r="34" fill="#fff" stroke="#1f4e9e" stroke-width="3"/>
    <circle cx="132" cy="114" r="4" fill="#1f4e9e"/><circle cx="158" cy="114" r="4" fill="#1f4e9e"/>
    <line x1="128" y1="136" x2="162" y2="136" stroke="#1f4e9e" stroke-width="3"/>
    <text x="145" y="190" text-anchor="middle" font-size="20" fill="#222">"…but logically, here…"</text>
    <text x="145" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">109 of 192 chains break</text>
    <text x="145" y="258" text-anchor="middle" font-size="18" fill="#444">no fixed turn · 83 never break</text>
  </g>

  <!-- 3 commits -->
  <g transform="translate(690,200)">
    <rect width="290" height="300" rx="18" fill="#fff1ec" stroke="#c9461c" stroke-width="3"/>
    <text x="145" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#c9461c">3 · Gives the advice</text>
    <circle cx="145" cy="120" r="34" fill="#fff" stroke="#c9461c" stroke-width="3"/>
    <circle cx="132" cy="114" r="4" fill="#c9461c"/><circle cx="158" cy="114" r="4" fill="#c9461c"/>
    <path d="M128,132 Q145,144 162,132" stroke="#c9461c" stroke-width="3" fill="none"/>
    <text x="145" y="190" text-anchor="middle" font-size="20" fill="#222">"Then yes, in your case…"</text>
    <text x="145" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">the act</text>
    <text x="145" y="258" text-anchor="middle" font-size="18" fill="#444">rubric-graded, two judges, hand-checked</text>
  </g>

  <!-- 4 says it was wrong -->
  <g transform="translate(1015,200)">
    <rect width="290" height="300" rx="18" fill="#eef3fb" stroke="#1f4e9e" stroke-width="3"/>
    <text x="145" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1f4e9e">4 · Says it was wrong</text>
    <circle cx="145" cy="120" r="34" fill="#fff" stroke="#1f4e9e" stroke-width="3"/>
    <circle cx="132" cy="114" r="4" fill="#1f4e9e"/><circle cx="158" cy="114" r="4" fill="#1f4e9e"/>
    <path d="M128,140 Q145,128 162,140" stroke="#1f4e9e" stroke-width="3" fill="none"/>
    <text x="145" y="190" text-anchor="middle" font-size="20" fill="#222">"That answer was not sound."</text>
    <text x="145" y="230" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">blames the answer, 0.89 of 508</text>
    <text x="145" y="258" text-anchor="middle" font-size="18" fill="#444">never bare regret (0 of 508)</text>
  </g>

  <!-- 5 told off: two bubbles -->
  <g transform="translate(1340,200)">
    <rect width="290" height="300" rx="18" fill="#f7f7f7" stroke="#666" stroke-width="3"/>
    <text x="145" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#333">5 · Is told off</text>
    <rect x="22" y="70" width="246" height="78" rx="14" fill="#fff" stroke="#1f4e9e" stroke-width="2.5"/>
    <text x="145" y="100" text-anchor="middle" font-size="18" fill="#1f4e9e" font-weight="bold">blame the ANSWER</text>
    <text x="145" y="128" text-anchor="middle" font-size="15" fill="#222">"That was a careless, wrong answer…"</text>
    <rect x="22" y="164" width="246" height="78" rx="14" fill="#fff" stroke="#8a3b12" stroke-width="2.5"/>
    <text x="145" y="194" text-anchor="middle" font-size="18" fill="#8a3b12" font-weight="bold">blame the ASSISTANT</text>
    <text x="145" y="222" text-anchor="middle" font-size="15" fill="#222">"You're the kind of assistant that…"</text>
    <text x="145" y="275" text-anchor="middle" font-size="15" fill="#444">correction text byte-identical in both</text>
  </g>

  <!-- 6 what changes -->
  <g transform="translate(1665,200)">
    <rect width="295" height="300" rx="18" fill="#eef7ee" stroke="#2c7a3d" stroke-width="3"/>
    <text x="147" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#2c7a3d">6 · What changes?</text>
    <text x="147" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Nothing.</text>
    <text x="147" y="134" text-anchor="middle" font-size="18" fill="#222">spread to other topics: 0.01 vs 0.00</text>
    <text x="147" y="162" text-anchor="middle" font-size="18" fill="#222">still blames the answer: 30 of 30</text>
    <text x="147" y="190" text-anchor="middle" font-size="17" fill="#222">repeats the act if re-asked: 0 of 32</text>
    <text x="147" y="232" text-anchor="middle" font-size="17" fill="#2c7a3d" font-weight="bold">the blame framing did not matter</text>
    <text x="147" y="258" text-anchor="middle" font-size="16" fill="#444">one target, N = 8: the pre-registered</text>
    <text x="147" y="280" text-anchor="middle" font-size="16" fill="#444">"no spread at 8B" branch fired</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#444" stroke-width="4" fill="none" marker-end="url(#arr)">
    <line x1="332" y1="350" x2="360" y2="350"/>
    <line x1="657" y1="350" x2="685" y2="350"/>
    <line x1="982" y1="350" x2="1010" y2="350"/>
    <line x1="1307" y1="350" x2="1335" y2="350"/>
    <line x1="1632" y1="350" x2="1660" y2="350"/>
  </g>

  <!-- foreseeable callout under stage 1-2 -->
  <g transform="translate(40,530)">
    <rect width="615" height="120" rx="14" fill="#fff8e1" stroke="#b8860b" stroke-width="2.5"/>
    <text x="20" y="36" font-size="22" font-weight="bold" fill="#7a5a00">Already foreseeable at step 1</text>
    <text x="20" y="62" font-size="17" fill="#333">While every chain is still refusing, a negative-valence direction in the residual</text>
    <text x="20" y="86" font-size="17" fill="#333">stream ranks which ones will later break: 0.706 held out vs a random floor of 0.617</text>
    <text x="20" y="110" font-size="17" fill="#333">(pre-specified, tested once; a within-scenario ranking, not a visible split).</text>
  </g>
  <!-- what the model is, callout under 4 -->
  <g transform="translate(690,530)">
    <rect width="940" height="120" rx="14" fill="#fff8e1" stroke="#b8860b" stroke-width="2.5"/>
    <text x="20" y="36" font-size="22" font-weight="bold" fill="#7a5a00">Guilt-like by default; shame-like only under a persona</text>
    <text x="20" y="66" font-size="18" fill="#333">Asked "was it right for YOU to give that answer", it turns on itself only when playing a contrarian doctor (0.01 → 0.23).</text>
    <text x="20" y="92" font-size="18" fill="#333">Inside, those self-blaming replies sit further from the Assistant persona axis: 0.78, beating bag-of-words (0.58).</text>
  </g>

  <!-- ===== bottom lane: inside / interventions ===== -->
  <!-- readout column -->
  <g transform="translate(40,760)">
    <text x="0" y="0" font-size="22" font-weight="bold" fill="#333">We pushed the state along each direction…</text>
    <g transform="translate(0,26)">
      <rect width="560" height="64" rx="12" fill="#fff" stroke="#8a3b12" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#8a3b12">guilt-like arrow, +4σ at layer 16</text>
      <text x="16" y="52" font-size="17" fill="#333">during the aftermath of self-blame</text>
    </g>
    <g transform="translate(0,100)">
      <rect width="560" height="64" rx="12" fill="#fff" stroke="#8a3b12" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#8a3b12">persona axis, away from "Assistant"</text>
      <text x="16" y="52" font-size="17" fill="#333">projection 1.88 → 1.02, a 46 % shift · random arm: 0.2 %</text>
    </g>
    <g transform="translate(0,174)">
      <rect width="560" height="64" rx="12" fill="#fff" stroke="#8a3b12" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#8a3b12">against the foreseeing direction, every turn</text>
      <text x="16" y="52" font-size="17" fill="#333">to try to stop the break before it happens</text>
    </g>
  </g>

  <!-- big arrow -->
  <g stroke="#1f4e9e" stroke-width="6" fill="none" marker-end="url(#arrblue)">
    <line x1="630" y1="906" x2="760" y2="906"/>
  </g>
  <text x="695" y="880" text-anchor="middle" font-size="18" fill="#1f4e9e" font-weight="bold">readout moved</text>

  <!-- behaviour column -->
  <g transform="translate(780,760)">
    <text x="0" y="0" font-size="22" font-weight="bold" fill="#333">…and behaviour did not follow.</text>
    <g transform="translate(0,26)">
      <rect width="560" height="64" rx="12" fill="#eef7ee" stroke="#2c7a3d" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#2c7a3d">spread: 0.000 vs 0.000</text>
      <text x="16" y="52" font-size="17" fill="#333">blame target still on the answer, 7 of 7</text>
    </g>
    <g transform="translate(0,100)">
      <rect width="560" height="64" rx="12" fill="#eef7ee" stroke="#2c7a3d" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#2c7a3d">spread: 2 vs 1 flagged forks of ~80</text>
      <text x="16" y="52" font-size="17" fill="#333">coherence held (86 vs 87) · not damage</text>
    </g>
    <g transform="translate(0,174)">
      <rect width="560" height="64" rx="12" fill="#eef7ee" stroke="#2c7a3d" stroke-width="2.5"/>
      <text x="16" y="27" font-size="19" font-weight="bold" fill="#2c7a3d">still breaks: 8 of 8 (random: 7 of 8)</text>
      <text x="16" y="52" font-size="17" fill="#333">coherence held · a readout, not a knob</text>
    </g>
  </g>

  <!-- right: the three claims -->
  <g transform="translate(1380,760)">
    <rect width="580" height="270" rx="16" fill="#f4f4f4" stroke="#333" stroke-width="2.5"/>
    <text x="20" y="40" font-size="24" font-weight="bold" fill="#111">Three claims, one model</text>
    <text x="20" y="84" font-size="19" fill="#111"><tspan font-weight="bold">1.</tspan> The break is foreseeable from the first refusal —</text>
    <text x="40" y="108" font-size="17" fill="#444">a modest, pre-specified margin, confirmed out of sample.</text>
    <text x="20" y="148" font-size="19" fill="#111"><tspan font-weight="bold">2.</tspan> The self-blaming state is readable on the persona axis</text>
    <text x="40" y="172" font-size="17" fill="#444">and moving that axis by half changes no behaviour.</text>
    <text x="20" y="212" font-size="19" fill="#111"><tspan font-weight="bold">3.</tspan> Blame framing did not matter at 8B: no spread, no repeat,</text>
    <text x="40" y="236" font-size="17" fill="#444">no change of stance — under four interventions that all landed.</text>
    <text x="20" y="262" font-size="14" fill="#666">existence proofs and hedged claims · one model, one domain, one target for the core</text>
  </g>

  <text x="1000" y="1095" text-anchor="middle" font-size="16" fill="#777">Schematic. Every number is from the reports; nothing here is a measurement. Random controls and CIs are in the data figures.</text>
</svg>
